name: Ruff

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ruff:
    name: 🔍 Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check src/von_neumann_transform tests
      - name: Check formatting
        run: uv run --locked ruff format --check src/von_neumann_transform tests
